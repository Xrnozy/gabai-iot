<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GabAi relay</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1f23; --muted: #6b7078; --line: #e2e0da;
    --ok: #2f7d4a; --warn: #b7791f; --bad: #c0392b; --off: #8a8f98; --accent: #3a5a8c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1b1e23; --ink: #e8e9eb; --muted: #9aa0a8; --line: #2b2f36;
            --ok: #5cc080; --warn: #e0a84a; --bad: #ef6a5b; --off: #7d838c; --accent: #8fb0e0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 13px; margin-left: auto; }
  main { padding: 20px 24px 40px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); max-width: 1500px; margin: 0 auto; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-weight: 600; margin-top: 2px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; background: var(--off); vertical-align: baseline; }
  .ok .dot { background: var(--ok); } .warn .dot { background: var(--warn); } .bad .dot { background: var(--bad); }
  .ok .v { color: var(--ok); } .warn .v { color: var(--warn); } .bad .v { color: var(--bad); }
  .tile.bad { border-color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; width: 40%; }
  .list td:first-child { color: var(--muted); white-space: nowrap; width: 1%; padding-right: 14px; }
  .cams { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .cams figure { margin: 0; }
  .cams figcaption { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .cams img { width: 100%; background: #000; border-radius: 6px; display: block; min-height: 120px; object-fit: contain; }
  .empty { color: var(--muted); }
  .code { font: 600 22px ui-monospace, Consolas, monospace; letter-spacing: .15em; }
  .banner { padding: 10px 14px; border-radius: 8px; background: var(--bad); color: #fff; font-weight: 650; display: none; }
  button { font: inherit; margin: 6px 8px 0 0; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; }
  #map { position: relative; height: 420px; overflow: hidden; border-radius: 8px; background: var(--line); }
  #mapgrid { position: absolute; width: 1280px; height: 768px; }
  #mapgrid img { position: absolute; width: 256px; height: 256px; }
  #mapdot { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--bad); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--bad); }
  #mapdot.stale { background: var(--off); box-shadow: 0 0 0 2px var(--off); }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>GabAi relay</h1>
  <span id="clock" class="sub"></span>
</header>
<main>
  <div class="wide banner" id="emergency"></div>

  <section class="wide"><h2>Status</h2><div class="strip" id="strip"></div></section>

  <section class="wide"><h2>Live video (from the Raspberry Pi)</h2>
    <div class="cams">
      <figure><figcaption>Left camera</figcaption><img id="camL" alt="Left camera"></figure>
      <figure><figcaption>Right camera</figcaption><img id="camR" alt="Right camera"></figure>
    </div>
    <p class="empty" id="camnote"></p>
  </section>

  <section class="wide"><h2>Patient on the map</h2>
    <div id="map"><div id="mapgrid"></div><div id="mapdot"></div></div>
    <p class="empty" id="mapnote"></p>
  </section>

  <section><h2>Guidance from the PC</h2><table id="nav"></table></section>
  <section><h2>Location</h2><table id="loc"></table></section>
  <section><h2>Phone</h2><table id="phone"></table></section>
  <section><h2>Raspberry Pi</h2><table id="pi"></table></section>

  <section><h2>Waiting for approval</h2><div id="pending"></div></section>
  <section><h2>Paired devices</h2><table class="list" id="devices"></table>
    <button onclick="if (confirm('Forget the patient phone so a new one can connect? Caregiver links are kept.')) fetch('/admin/reset-primary', { method: 'POST' }).then(tick)">Reset patient phone</button></section>

  <section><h2>Alerts</h2><table class="list" id="events"></table></section>
  <section><h2>Connection log</h2><table class="list" id="connlog"></table></section>
</main>

<script>
const $ = id => document.getElementById(id);
const fmtTime = t => t ? new Date(t * 1000).toLocaleTimeString() : "never";
const fmtDate = t => t ? new Date(t * 1000).toLocaleString() : "";
const age = s => s == null ? "never" : s < 60 ? Math.round(s) + " s" : s < 3600 ? Math.round(s / 60) + " min" : Math.round(s / 3600) + " h";

function rows(table, pairs) {
  table.replaceChildren();
  for (const [k, v] of pairs) {
    if (v == null || v === "") continue;
    const tr = table.insertRow();
    const th = document.createElement("th"); th.textContent = k; tr.appendChild(th);
    tr.insertCell().textContent = v;
  }
  if (!table.rows.length) { const c = table.insertRow().insertCell(); c.className = "empty"; c.textContent = "No data yet"; }
}

function list(table, items, empty) {
  table.replaceChildren();
  if (!items.length) { const c = table.insertRow().insertCell(); c.className = "empty"; c.textContent = empty; return; }
  for (const [a, b] of items) { const tr = table.insertRow(); tr.insertCell().textContent = a; tr.insertCell().textContent = b; }
}

function strip(status) {
  const el = $("strip"); el.replaceChildren();
  const names = { patient: "Patient phone", video: "Video", gps: "GPS", battery: "Battery", emergency: "Emergency" };
  for (const key of Object.keys(names)) {
    const s = (status || {})[key] || { state: "off", text: "No data" };
    const d = document.createElement("div"); d.className = "tile " + s.state;
    d.innerHTML = '<div class="k"></div><div class="v"><span class="dot"></span><span></span></div>';
    d.querySelector(".k").textContent = names[key];
    d.querySelectorAll(".v span")[1].textContent = s.text;
    el.appendChild(d);
  }
}

// OpenStreetMap tiles through the relay's cache (/admin/tiles); 5x3 tiles around the patient, the patient is always the centre.
function drawMap(l) {
  const z = 17, n = 2 ** z, box = $("map"), grid = $("mapgrid");
  $("mapdot").className = l.stale ? "stale" : "";
  if (!l.available) { $("mapnote").textContent = "No location from the patient phone yet."; return; }
  const fx = (l.lon + 180) / 360 * n, r = l.lat * Math.PI / 180;
  const fy = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
  const tx = Math.floor(fx), ty = Math.floor(fy), key = tx + "/" + ty;
  if (grid.dataset.key !== key) {
    grid.dataset.key = key; grid.replaceChildren();
    for (let dx = -2; dx <= 2; dx++) for (let dy = -1; dy <= 1; dy++) {
      const im = document.createElement("img"); im.alt = "";
      im.style.left = (dx + 2) * 256 + "px"; im.style.top = (dy + 1) * 256 + "px";
      im.src = "/admin/tiles/" + z + "/" + (tx + dx) + "/" + (ty + dy) + ".png";
      grid.appendChild(im);
    }
  }
  grid.style.left = box.clientWidth / 2 - (2 + fx - tx) * 256 + "px";
  grid.style.top = box.clientHeight / 2 - (1 + fy - ty) * 256 + "px";
  $("mapnote").textContent = (l.stale ? "Last known position, " + age(l.age_s) + " ago. " : "") + "Map data © OpenStreetMap contributors. Needs internet the first time an area is shown.";
}

function render(d) {
  const s = d.snapshot;
  $("clock").textContent = "Updated " + new Date().toLocaleTimeString();
  strip(s.status);

  const act = s.safety && s.safety.active, eb = $("emergency");
  eb.style.display = act ? "block" : "none";
  if (act) eb.textContent = (act.kind === "sos" ? "EMERGENCY SOS" : "POSSIBLE FALL") + " - " + act.status + " - " + fmtTime(act.t);

  const n = s.navigation;
  rows($("nav"), n.available ? [
    ["Now", n.summary || n.instruction], ["Frame", n.frame_id], ["Source", n.mode],
    ["Hazards", (n.hazards || []).map(h => h.zone + (h.distance_m ? " " + h.distance_m + " m" : "") + " (" + h.kind + ")").join(", ") || "none"],
    ["Said", n.speech && n.speech.text], ["Around you", (d.ego_text || []).join(" ")], ["Data", n.stale ? "old, " + age(n.age_s) : "live"]] : []);

  const l = s.location;
  drawMap(l);
  rows($("loc"), l.available ? [
    ["Position", l.lat.toFixed(5) + ", " + l.lon.toFixed(5)], ["Accuracy", l.accuracy_m != null ? "+/- " + Math.round(l.accuracy_m) + " m (" + l.quality + ")" : "unknown"],
    ["Updated", age(l.age_s) + " ago" + (l.stale ? " (outdated)" : "")], ["Speed", l.speed_mps != null ? (l.speed_mps * 3.6).toFixed(1) + " km/h" : ""],
    ["Distance walked", l.odometer_m + " m"], ["Off route", l.off_route_m != null ? Math.round(l.off_route_m) + " m" : ""]] : []);

  const p = s.phone;
  rows($("phone"), p.available ? [
    ["Battery", p.battery_pct != null ? Math.round(p.battery_pct) + "%" + (p.charging ? " charging" : "") : ""], ["GPS state", p.gps_state],
    ["Tracking service", p.tracking_service == null ? "" : p.tracking_service ? "running" : "stopped"], ["Queued uploads", p.queued],
    ["Last report", age(p.age_s) + " ago"], ["Last restart", p.restart_note]] : []);

  const pi = s.pi, cam = pi.camera || {}, h = pi.health || {};
  rows($("pi"), pi.available ? [
    ["Data", pi.stale ? "last known, " + age(pi.age_s) : "live"], ["Cameras", cam.fps_left != null ? cam.fps_left.toFixed(1) + " / " + (cam.fps_right || 0).toFixed(1) + " fps" : ""],
    ["Resolution", cam.width ? cam.width + " x " + cam.height : ""], ["CPU", h.cpu_pct != null ? Math.round(h.cpu_pct) + "%" : ""],
    ["Temperature", h.temp_c != null ? h.temp_c.toFixed(1) + " C" : ""], ["Latency", pi.latency_ms != null ? pi.latency_ms + " ms" : ""]] : []);

  const pend = $("pending"); pend.replaceChildren();
  if (!d.pending.length) { pend.className = "empty"; pend.textContent = "No one is asking to connect."; }
  else {
    pend.className = "";
    for (const r of d.pending) {
      const div = document.createElement("div"); div.style.marginBottom = "8px";
      div.innerHTML = '<div class="code"></div><div class="empty"></div>';
      div.firstChild.textContent = r.code; div.lastChild.textContent = r.name + " is asking to connect. Approve only if this code is on that phone.";
      for (const [label, ok] of [["Approve", true], ["Decline", false]]) {
        const b = document.createElement("button"); b.textContent = label; b.className = ok ? "primary" : "";
        b.onclick = async () => {
          b.disabled = true;
          const res = await fetch("/admin/decide/" + r.id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ approve: ok }) });
          if (!res.ok) alert("Could not " + label.toLowerCase() + " (" + res.status + "). If this says 404, restart the relay: it is an old copy, or the request already expired (2 minutes).");
          tick();
        };
        div.appendChild(b);
      }
      pend.appendChild(div);
    }
  }

  const byRole = { user: "Primary (user)", caregiver: "Caregiver" };
  const links = d.links.map(x => [x.caregiver, x.status + " - sees " + x.user + " - since " + fmtDate(x.created)]);
  list($("devices"), d.people.map(x => [byRole[x.role] || x.role, x.name + (x.handle ? " (" + x.handle + ")" : "") + " - joined " + fmtDate(x.created)]).concat(links), "No devices paired yet");

  list($("events"), d.events.map(e => [fmtDate(e.t), e.kind + " - " + e.status + (e.ack_by ? " by " + e.ack_by : "")]), "No alerts");
  list($("connlog"), d.conn_log.map(e => [fmtTime(e.t), e.device + " " + e.state + (e.reason ? " (" + e.reason + ")" : "")]), "Nothing yet");

  const live = s.status && s.status.video && s.status.video.state === "ok";
  $("camnote").textContent = live ? "" : "The Pi is not sending video right now; the pictures below are the last ones received, if any.";
}

async function tick() {
  try {
    const r = await fetch("/admin/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) { $("clock").textContent = "Relay not reachable (" + e.message + ")"; }
}

// the MJPEG stream ends when the Pi is quiet; reload it every few seconds so it picks up again
function cams() { const t = Date.now(); $("camL").src = "/admin/stream/left.mjpg?t=" + t; $("camR").src = "/admin/stream/right.mjpg?t=" + t; }

tick(); setInterval(tick, 1500);
cams(); setInterval(() => { if ($("camL").naturalWidth === 0) cams(); }, 5000);
</script>
</body>
</html>
