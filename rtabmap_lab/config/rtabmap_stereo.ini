[Core]
# Vis/MinInliers 12 and Vis/MaxFeatures 1500: measured with rtabmap_lab.tools.diagnose on the fast recording with pairs skipped, lost frames fell from 84 to 38 of 150 (default 20 / 1000).
# RTAB-Map parameters for the stereo-only experiment (overrides of the defaults; `RTABMap --params` lists all of them). Command-line --rtabmap-arg overrides these.
Odom/Strategy=0
Rtabmap/DetectionRate=2
RGBD/LinearUpdate=0.05
RGBD/AngularUpdate=0.05
Kp/MaxFeatures=500
Vis/MaxFeatures=1500
Vis/MinInliers=12
# dense depth: RTAB-Map's cv::StereoSGBM instead of its default block matcher (33% of pixels valid against 13%, and it follows surfaces instead of scattered blobs, on the same calibrated pairs)
# P1/P2 were 8/32: OpenCV takes them as absolute penalties, so that was almost no smoothness (60% of board pixels valid, noise 7.4 mm). Scaled to the window (8 and 32 x blocksize^2) and the 3-way mode: 91% valid, 5.7 mm, 12 ms instead of 45 ms (rtabmap_lab/tools/stereo_bench.py, board pairs); on the recording valid depth 25% -> 53%.
Stereo/DenseStrategy=1
StereoSGBM/NumDisparities=96
StereoSGBM/BlockSize=9
StereoSGBM/UniquenessRatio=10
StereoSGBM/P1=648
StereoSGBM/P2=2592
StereoSGBM/Mode=2
